const __docs={"INSTALLATION":"# Upload de fire filer fra iPhone\n\nDenne udgave er allerede bygget. Du behøver hverken Node.js eller en computer.\n\n1. Pak ZIP-filen ud i Filer på iPhone.\n2. Åbn dit GitHub-repository i Safari, og vælg Add file > Upload files.\n3. Vælg choose your files > Gennemse, og vælg de fire udpakkede filer. Upload index.html, sw.js, manifest.webmanifest og apple-touch-icon.png direkte i roden.\n4. Gem med Commit changes.\n5. Under Settings > Pages vælges Deploy from a branch, main og / (root). Gem og vent på webadressen.\n6. Åbn webadressen i Safari, og vælg Del > Føj til hjemmeskærm.\n\nEn ZIP-fil, som blot uploades til GitHub, bliver ikke pakket ud af GitHub. Upload de fire løse filer.\n\n## 2. Føj til hjemmeskærmen\n\n1. Åbn appens HTTPS-adresse i **Safari** på iPhone.\n2. Lad siden indlæse færdig med internetforbindelse, så appfilerne kan gemmes offline.\n3. Tryk **Del** og derefter **Føj til hjemmeskærm**. På nyere iOS kan **Åbn som webapp** være en kontakt, der skal være slået til.\n4. Åbn **Søndagsro** fra hjemmeskærmen. Lav og gem din første ugeplan her.\n5. Kontrollér offlineadgangen: Luk appen, slå flytilstand til, og åbn den igen. Den gemte ugeplan, opskrifterne og indkøbslisten skal kunne åbnes. Nye tilbud og eksterne kildesider kræver internet.\n\nWebapps installeret på hjemmeskærmen kan have andet lokalt lager end en Safari-fane. Eksportér og importér en sikkerhedskopi, hvis data ikke følger med fra fanen.\n\n## Lokal afprøvning på computer\n\nKør `npm run build` og `npm start`, og åbn `http://localhost:4173` på computeren. `localhost` er en særlig sikker kontekst på computeren. `http://COMPUTERENS-IP:4173` på iPhone giver almindeligvis **ikke** adgang til service workers og opfylder derfor ikke kravet til installation med offlineadgang. En HTTPS-hostingadresse er den enkleste iPhone-løsning.\n\n## Opdatering, flytning og sikkerhedskopi\n\n- Brug appens **Eksportér sikkerhedskopi**, og gem JSON-filen i Filer eller et andet sted, du selv vælger. Brug **Importér sikkerhedskopi** for at flytte data til en ny enhed eller gendanne dem.\n- Opdater filer på **samme HTTPS-adresse** for at bevare adgang til det lokale lager. Luk alle vinduer med appen, og åbn den igen, så en ventende service worker kan aktiveres. Ved en kodeopdatering skal udvikleren også ændre service workerens cacheversionsnavn i `sw.js`.\n- Skifter du domæne, repositorynavn eller browser, følger lokale data ikke automatisk med. Eksportér først, og importér på den nye adresse.\n- Sletter du hjemmeskærmsappen eller Safari-webstedsdata, nulstiller telefonen eller løber tør for lager, kan lokale data gå tabt. En PWA kan ikke garantere permanent lagring mod iOS-oprydning. Gem jævnligt en sikkerhedskopi.\n- Du behøver normalt ikke geninstallere efter en opdatering. Slet kun appen efter at have sikret dine data. Hosting skal fortsat eksistere for geninstallation, opdateringer og den første indlæsning på en ny enhed; allerede gemte appfiler og planer kan bruges offline.\n\nDer er ingen løbende AI-udgift. Gratis hosting afhænger af hostingudbyderens gældende vilkår. iPhone-installation og offlineåbning skal kontrolleres på en fysisk iPhone; en test i projektets Linux-miljø kan ikke erstatte denne kontrol.\n","NUTRITION":"# Næringsgrundlag og opskrifter\n\nAppens indbyggede bibliotek indeholder 21 fødevarereferencer og 13 konkrete opskrifter: syv kødbaserede aftensmåltider, et fisketilvalg, et vegetarisk tilvalg, to morgenmåltider og to frokoster. Hvert kødbaseret aftensmåltid indeholder præcis 200 g råt, spiseligt kød pr. person. Opskrifterne er udarbejdet til appen med konkrete tilberedningstrin; de er ikke prøvetilberedt og må ikke markedsføres som køkkentestede.\n\n## Kilder\n\nAlle referenceværdier findes i `src/data.js` sammen med kilde, fødevare-ID, vægtgrundlag og kontroltidspunkt. Mængder angives i gram og næringsværdier pr. 100 g. Kilderne er:\n\n- [USDA FoodData Central](https://fdc.nal.usda.gov/): SR Legacy-poster med specifikke FDC-ID'er. Kylling 171077, kalkun 172850, oksekød 171790, svinemørbrad 168249, laks 175167, ris 169756, pasta 169736, kartofler 170026, broccoli 170379, gulerødder 170393, løg 170000, rød peber 170108, hvidkål 169975, knuste tomater 170501, drænede kidneybønner 174285, olivenolie 171413, tørre havregryn 173904, æble 171688 og æg 171287.\n- [Arla Pro Skyr Naturel 0,2 %, produkt 26707](https://www.arlapro.com/da/produkter/skyr-naturel-02pct-5kg-26707/): deklaration 61 kcal, 10 g protein, 4 g kulhydrat og 0,2 g fedt pr. 100 g. Verificeret ved faktisk opslag 2. november 2026.\n- [Schulstad Det Gode Solsikkerugbrød, produkt 19291, 950 g](https://www.schulstad.dk/alle-produkter/det-gode-solsikkerugbrod-950-g/): deklaration 242 kcal, 6,6 g protein, 33 g kulhydrat og 7,3 g fedt pr. 100 g. Verificeret ved faktisk opslag 2. november 2026. Brødet er klar til brug.\n\nSom primær tabelreference blev [USDA Standard Reference 28, korn og pasta](https://www.ars.usda.gov/ARSUserFiles/80400535/Data/SR/SR28/reports/sr28fg20.pdf) åbnet med faktisk opslag. Flere USDA-poster blev krydstjekket via indekserede gengivelser. USDA's nuværende FoodData Central-grænseflade er klientrenderet og kunne ikke udlæses komplet i researchværktøjet. De indbyggede tal er derfor et fast referenceudsnit med kildehenvisninger, ikke en påstand om en ny, fuld automatisk USDA-hentning. Fridas enkeltposter viderestillede ved opslag til den klientrenderede fcdb.fooddata.dk-grænseflade uden udlæselige næringstabeller. Appen hævder ikke, at Frida er hentet automatisk.\n\n## Beregning og begrænsninger\n\nHver ingrediens bidrager med `gram / 100 × referenceværdi`. Alle bidrag lægges sammen før afrunding til visning. Olie, skyrdressing og tomatsauce er konkrete ingredienser og indgår i næringen. Opskrifterne indeholder ingen skjult stegefedt, mayonnaise eller sauce. Vand til kogning bidrager ikke til kcal eller makroer.\n\nRis, pasta og havregryn vejes tørre. Kød og fisk vejes råt uden ben, skind eller afpuds. Bønner vejes efter dræning, og prispakkens gram skal tilsvarende være drænet spiselig mængde. Æg vejes uden skal. Væske i tomatkonserves medregnes. Olie vejes i gram, ikke milliliter. De færdige retter fordeles ligeligt efter tilberedning; den færdige portions vægt kan ikke udledes præcist af de rå gram, fordi vand optages eller fordamper.\n\nKulhydratvisningen er ensrettet til at udelade kostfibre, så brugerens danske daglige kulhydratmål ikke sammenlignes med en blanding af EU- og USDA-totaler. USDA's \"carbohydrate by difference\" gemmes uændret som `carbsTotal`; dokumenterede kostfibre gemmes som `fiber`. Appens `carbs` er `carbsTotal - fiber`. Dette er et estimat for tilgængeligt kulhydrat, ikke en påstand om en analytisk bestemt EU-varedeklaration. Energi, protein og fedt bevares som opgivet i kilden. Arla og Schulstad deklarerer allerede kulhydrat uden kostfibre; deres kulhydrat ændres ikke. Metoden står i `carbohydrateBasis` og i appens næringsnote.\n\nDe anvendte USDA-kostfibre pr. 100 g er: ris 1,3 g, pasta 3,2 g, kartofler 2,1 g, broccoli 2,6 g, gulerødder 2,8 g, løg 1,7 g, rød peber 2,1 g, hvidkål 2,5 g, knuste tomater 1,9 g, drænede kidneybønner 5,5 g, havregryn 10,1 g og æble 2,4 g. Kød, fisk, olie og æg har 0 g i de valgte poster. De angivne fiberdata blev krydstjekket i de tilsvarende indekserede FDC-gengivelser. Eksempelvis [ris FDC 169756](https://nutri-db.com/en/foods/169756), [havre FDC 173904](https://nutri-db.com/en/foods/173904), [bønner FDC 174285](https://www.datayoureat.com/r/_-UXXgrGKu8b/Kidney_beans_canned_drained?l10n=NONE) og [tomat FDC 170501](https://datanutri.com/foods/170501/tomatoes-crushed-canned). Fiber for Schulstad-brødet er 9,3 g efter producentens deklaration. Ingen ukendt fiberværdi erstattes stiltiende med nul: USDA-konstruktøren kræver et eksplicit dokumenteret fiberfelt.\n\nNæring er generiske referenceestimater, ikke en laboratoriemåling af den købte vare; andre udskæringer, fedtprocenter og mærker kan afvige. Skyrreferencen bruges kun som næringsgrundlag og siger intet om pris eller tilgængelighed i de valgte kæder.\n\nDer medfølger ingen universelle vægttabsmål. Brugeren vælger selv sine daglige mål, og et aftensmåltid er kun aftensmåltidets bidrag til disse mål.\n\n## Praktisk opbevaring\n\nKøkkenplanen skal følge opskrifternes opbevaringstekst: hurtig nedkøling i lave beholdere, højst 5 °C i køleskab, højst to dages køleskabsportioner, straksfrysning af senere portioner, optøning i køleskab og grundig genopvarmning. Kolde skyrskåle, salater og kogte æg tilberedes igen senere på ugen og planlægges ikke som en uges færdig køleskabsmad.\n","SOURCES":"# Tilbudskilder – faktiske opslag 2. november 2026\n\nDer er ingen demonstrationspriser i appens startdata. `src/offers.js` indeholder **tre daterede prisobservationer**, ikke en løbende opdateret prissammenligning. Deres originale gyldighedsdatoer bevares; planmotoren fravælger udløbne priser. Ingen postnummerbestemt tilgængelighed eller lagerstatus er bekræftet.\n\nOpslagene nedenfor blev foretaget med webværktøjets faktiske `open`/`click`. Shellens HTTP-proxy var utilgængelig, og en forespørgsel til REMAs produkt-API gav ikke en læsbar respons i webværktøjet. Derfor er hverken feedkontrakt eller CORS i Safari verificeret. Appen påstår ikke automatisk hentning; knappen viser den kendte kildestatus og vejleder til manuel indtastning.\n\n| Kæde | Offentlig primærkilde og faktisk resultat | Produkter / begrænsning |\n|---|---|---|\n| REMA 1000 | [Offentlig webshop](https://shop.rema1000.dk/) blev læst med aktuelle avisvarer og perioden **1.–7. november 2026**. Kædens hoveddomæne gav 403. | Kartofler 2 kg **12 kr.**, 6 kr./kg er importeret. Hakket gris 8–12 %, 500 g 20 kr. og hakket okse 15–18 %, 400 g 35 kr. blev også set, men er **ikke** importeret: de svarer ikke til næringskatalogets mørbrad og 5 % oksekød. |\n| Netto | [Officiel Netto Avis](https://netto.dk/netto-avisen/) viste **31. oktober–6. november**. Netto+-priser var mærket som appkrævende. | [eTilbudsavis gulerødder](https://etilbudsavis.dk/soeg/guler%C3%B8dder) havde produkt-id `hv-AJrfnLDqs2I4lUxhyz`, ØGO gulerødder **800 g, 15 kr.**, 18,75 kr./kg; 31.10–6.11. Denne præcise pris er importeret som observation fra tredjepart. Kylling 69 kr. havde flere udskæringer og 900–1000 g og er derfor ikke importeret. |\n| SuperBrugsen | [Officiel avis](https://superbrugsen.coop.dk/avis/) og [PDF-indgang](https://superbrugsen.coop.dk/avis-pdf/) blev åbnet. Primærsiden angav **30. oktober–5. november 2026**, men produktindhold blev ikke udleveret i læsbart feed. | **Ingen konkrete priser importeret.** Medlemstilbud kan kræve aktivering i Coop-appen og må ikke antages at gælde alle. Indtast kun egne relevante tilbud. |\n| MENY | [Officiel indgang](https://meny.dk/ugensavis) linker til [officiel reader](https://ugensavis.meny.dk/), som blev åbnet. Den angav **uge 45, 30.10–5.11.2026**. | Readeren viste bl.a. entrecote 2 stk./500 g til **179,95 kr.** og forskellige medlemspriser. Ingen priser importeret, da disse konkrete varianter ikke matcher kataloget. Readeren er brugbar manuelt; automatisk lokal feed og CORS er ikke verificeret. |\n| 365discount | [Officiel avis](https://365discount.coop.dk/365avis/) angav **29. oktober–4. november 2026**. | [eTilbudsavis gulerødder](https://etilbudsavis.dk/soeg/guler%C3%B8dder) havde produkt-id `jde4NydTdDeC8nt16b-YW`, Lammefjordsgulerødder **1,5 kg, 12 kr.**, 8 kr./kg; 29.10–4.11. Importeret som observation fra tredjepart. |\n\nTjek/eTilbudsavis viste strukturerede produktfelter indlejret i søgesidens HTML: navn, pris, størrelse, gyldighed og medlems-/apppris. Det dokumenterer en prisobservation, men ikke en frit tilgængelig, stabil klient-API. Der er ikke implementeret scraping af HTML via en tredjepartsproxy.\n\n[Prejs API](https://prej.dk/api) blev undersøgt. Den oplyser en gratis hobbykvote på 25 kald/dag med e-mailbekræftet nøgle, samt betalte planer. Den er ikke integreret, da appen skal fungere uden konto og nøgle, og en gratis offentlig no-login API ikke blev bekræftet.\n\n## Manuel indtastning og lokale priser\n\nAlle fem kæder kan bruges via prisformularen. Vælg præcis ingrediens/variant, butik, pakningens spiselige gram, pakkepris eller flerstykstilbud, gyldighed og dokumentation. Medlemspriser kræver aktivt medlemsvalg. Brug postnummeret til at begrænse egne lokale priser; appen må ikke fremstille et valgt postnummer som en verificeret butikssøgning. Normalpriser skal komme fra produkt/bon eller egen indtastning; intet normalt priskatalog er opdigtet.\n\nDet betyder, at første plan kan være ufuldstændigt prissat, indtil brugeren har suppleret med kød, tørvarer, olie og andre manglende varer. En sådan plan har ikke en endelig ugepris eller en påstand om at overholde budgettet. Tilbudssammenligning er alene mellem de gyldige priser, der faktisk er gemt på enheden.\n\n## Vedligeholdelse\n\nAutomatisk aktualisering kræver en separat, dokumenteret offentlig endpoint, som tillader browserkald, eller en selvhostet datatjeneste. En sådan tjeneste leveres ikke med denne lokale app. Hver dateret observation skal ved opdatering erstattes med et nyt opslag og nye gyldighedsdatoer – aldrig blot få ændret kontroltidspunkt.\n"};

function renderDay(day,index){if(!day)return '';return `<div class="card"><div class="card-header"><h3>${esc(day.label)}, ${dateLabel(day.date)}</h3><button class="ghost small" data-action="day" data-index="-1">Vis hele ugen</button></div>${Object.entries(day.meals).map(([type,id])=>{const r=currentRecipe(id);return `<div class="list-row"><div class="row-info"><span class="eyebrow">${({breakfast:'Morgenmad',lunch:'Frokost',dinner:'Aftensmad'})[type]}</span><b>${esc(r.name)}</b><p>${state.profile.persons} portioner · ${r.ingredients.reduce((s,i)=>s+i.grams,0)} g rå ingredienser pr. portion</p></div><button class="icon-button" data-action="recipe" data-id="${esc(id)}" data-servings="${state.profile.persons}" aria-label="Se opskrift">${icon('book')}</button>${type==='dinner'?`<button class="icon-button" data-action="swap" data-index="${index}" aria-label="Udskift retten">${icon('refresh')}</button>`:''}</div>`;}).join('')}<h3 style="margin-top:22px">${state.profile.mode==='all'?'Hele dagen':'Aftensmadens bidrag'} · pr. person</h3>${macroBar(day.nutrition)}${targetBars(day.nutrition)}<p class="tiny muted" style="margin-top:15px">${state.profile.mode==='all'?'Snacks og drikke uden for opskrifterne indgår ikke.':'Dagens øvrige måltider indgår ikke i denne plan.'}</p></div>`;}
function targetBars(n){return Array.from({length:state.profile.persons},(_,i)=>{const t=state.profile.targets?.[i]||{};return `<p class="tiny muted" style="margin-top:18px">Person ${i+1} · ${Object.values(t).some(Boolean)?'dine egne dagsmål':'ingen dagsmål angivet'}</p>${['kcal','protein','carbs','fat'].filter(k=>t[k]>0).map(k=>`<div class="tiny muted" style="margin:10px 0">${({kcal:'Energi',protein:'Protein',carbs:'Kulhydrat',fat:'Fedt'})[k]}: ${Math.round(n[k])} / ${esc(t[k])} ${k==='kcal'?'kcal':'g'} (${Math.round(n[k]/t[k]*100)} %)<div class="progress"><span style="width:${Math.min(100,n[k]/t[k]*100)}%"></span></div></div>`).join('')}`;}).join('');}
function heading(eye,title,sub,action=''){return `<div class="page-heading"><div><p class="eyebrow">${eye}</p><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;}
function renderShopping(){const p=state.plan;return `${heading('Fra plan til indkøb','Lidt mindre at huske.','Kryds af undervejs. Listen bliver på din telefon.',`<button class="secondary" data-action="offer">${icon('plus')} Tilføj en pris</button>`)}${stats()}${budgetNotice()}${p.savingsSecondStore!==null?`<p class="tiny muted">Samme kurv i én butik: ${p.oneStoreTotal===null?'uafklaret':money(p.oneStoreTotal)+' kr.'} · To butikker: ${p.twoStoreTotal===null?'uafklaret':money(p.twoStoreTotal)+' kr.'} · Besparelse: ${money(p.savingsSecondStore)} kr.</p>`:''}<div class="two-columns"><div>${p.stores.map(id=>`<section class="card"><div class="card-header"><h2>${esc(storeName(id))}</h2><span class="badge">${money(p.shopping.filter(r=>r.store===id).reduce((s,r)=>s+r.total,0))} kr.</span></div>${p.shopping.filter(r=>r.store===id).map(r=>`<label class="list-row ${state.checked[r.id]?'checked':''}"><input type="checkbox" data-check="${esc(r.id)}" ${state.checked[r.id]?'checked':''}><div class="row-info"><b>${esc(r.offer?.name||r.name)}</b><p>${r.packages} × ${grams(r.packageGrams)} · behov ${grams(r.neededGrams)}<br>${r.leftoverGrams>0?`${grams(r.leftoverGrams)} til overs · `:''}${r.offer?.memberOnly?'Medlemspris · ':''}${r.offer?.type==='regular'?'Normalpris':'Tilbud'}${r.offer?.validTo?' til '+dateLabel(r.offer.validTo):''}</p></div><span class="row-price">${money(r.total)} kr.<small>${money(r.total/r.purchasedGrams*1000)} kr./kg</small></span></label>`).join('')}</section>`).join('')}${p.unresolved.length?`<section class="card"><div class="card-header"><h2>Mangler en pris</h2><span class="badge warning">${p.unresolved.length} uafklarede</span></div><p class="tiny muted">Disse varer er nødvendige, men er ikke med i det kendte beløb. Angiv en dokumenteret normalpris eller dit eget tilbud.</p>${p.unresolved.map(r=>`<div class="list-row"><div class="row-info"><b>${esc(r.name)}</b><p>${grams(r.neededGrams)} skal købes</p></div><button class="secondary small" data-action="offer" data-ingredient="${esc(r.ingredientId)}">Tilføj pris</button></div>`).join('')}</section>`:''}${!p.shopping.length&&!p.unresolved.length?'<div class="card empty">Alt til planen findes i dit køkkenlager.</div>':''}</div><aside><section class="card"><h2>Fra dit køkken</h2><p class="tiny muted">Trukket fra, før vi regner pakker.</p>${p.ingredientsRequired.filter(r=>r.pantryGrams>0).map(r=>`<div class="ingredient-row"><span>${esc(r.name)}</span><strong>${grams(r.pantryGrams)}</strong></div>`).join('')||'<p class="tiny muted">Dit køkkenlager er tomt.</p>'}<button class="text-link" data-action="nav" data-view="kitchen">Ret mit lager ${icon('arrow')}</button></section><section class="card"><h2>Gode rester</h2><p class="tiny muted">Indkøbte gram, som ikke bruges i planen. De er ikke automatisk føjet til lageret.</p>${p.leftovers.map(r=>`<div class="ingredient-row"><span>${esc(r.name)}</span><strong>${grams(r.grams)}</strong></div>`).join('')||'<p class="tiny muted">Ingen beregnede pakkerester endnu.</p>'}</section></aside></div>`;}
function renderPrep(){const p=state.plan;return `${heading('En rolig stund i køkkenet','Lav maden. Find roen.','Afvej det hele først. Så er ugens madkasser godt på vej.')}<div class="notice success">${icon('snow')}<span>Køl maden hurtigt ned i lave beholdere. Gem højst to dages portioner ved maks. 5 °C; frys resten straks efter nedkøling. Optø i køleskab og varm helt igennem til mindst 75 °C. Kolde måltider samles højst to dage frem.</span></div><div class="two-columns"><div><section class="card"><h2>1. Find ingredienserne frem</h2><p class="tiny muted">Hele ugens mængder før tilberedning – inklusive det, du har på lager.</p>${p.ingredientsRequired.map(r=>`<div class="ingredient-row"><span>${esc(r.name)}<small class="muted" style="display:block;font-size:9px;margin-top:4px">${esc(currentIngredients()[r.id]?.weightNote||'Rå, spiselig vægt')}</small></span><strong class="no-wrap">${grams(r.requiredGrams)}</strong></div>`).join('')}</section>${p.batches.map((b,i)=>`<section class="card"><div class="card-header"><h2>${i+2}. ${esc(b.name)}</h2><span class="badge">${b.servings} portioner</span></div><p class="tiny muted">${b.dayLabels.map(esc).join(' & ')} · ${esc(({dinner:'Aftensmad',breakfast:'Morgenmad',lunch:'Frokost'})[b.category])}</p><div class="prep-summary">${b.ingredients.map(r=>`<span class="badge">${grams(r.grams)} ${esc(currentIngredients()[r.id]?.name||r.name)}</span>`).join('')}</div><div class="prep-boxes"><b>I hver af ${b.servings} madkasser, målt før tilberedning:</b><br>${b.ingredients.map(r=>`${grams(r.gramsPerServing)} ${esc(r.name)}`).join(' · ')}<br>Vej den færdige mængde af hver tilberedt ingrediens og del med ${b.servings}. Kogt vægt varierer; ${b.ingredients.some(r=>['rice','pasta'].includes(r.id))?'ris og pasta ovenfor er altid tør vægt.':'de rå gram ovenfor er ikke færdig portionsvægt.'}${prepWeighing(b)}</div><button class="text-link" data-action="recipe" data-id="${esc(b.recipeId)}" data-servings="${b.servings}">Se tilberedningstrin ${icon('arrow')}</button></section>`).join('')}</div><aside><section class="side-panel">${icon('chef')}<h3>Gør det i denne rækkefølge</h3><p>1. Mærk madkasser med ret og dag.<br>2. Start ovn og tørre ris eller pasta.<br>3. Klargør grøntsager og vej olie af.<br>4. Tilbered kød på et separat skærebræt.<br>5. Vej færdig mad, fordel ligeligt og køl hurtigt ned.</p><div class="panel-foot">Kog gerne alle ris samlet. Brug pakkens anvisning til vand og kogetid. Del de kogte ris efter forholdet mellem retternes tørre rismængder.</div></section></aside></div>`;}
function prepWeighing(b){return `<details style="margin-top:13px"><summary>Vej færdig mad – beregn gram pr. madkasse</summary><p class="tiny muted">Indtast den samlede tilberedte vægt uden gryde. Vi deler med ${b.servings}; vi gætter ikke på kogesvind eller vandoptagelse.</p><div class="form-grid">${b.ingredients.map(i=>{const key=`${b.id}-${i.id}`,v=state.cookedWeights?.[key];return `<label class="field">${esc(i.name)}<input type="number" inputmode="decimal" min="0" max="100000" step="0.1" placeholder="Færdige gram i alt" data-cooked="${esc(key)}" data-servings="${b.servings}" value="${v??''}"><small id="weigh-${esc(key)}">${v===undefined?'Vej hele den færdige mængde':grams(v/b.servings)+' i hver madkasse'}</small></label>`;}).join('')}</div></details>`;}

 ${state.offers.map(o=>{const usable=active.some(a=>a.id===o.id);return `<section class="card"><div class="card-header"><div><span class="eyebrow">${esc(storeName(o.store))} · ${o.manual?'Din indtastning':'Verificeret kilde'}</span><h3>${esc(o.name)}</h3></div><span class="badge ${usable?'':'warning'}">${usable?'Anvendelig':'Bruges ikke'}</span></div><div class="offer-details">${grams(o.packageGrams)} · ${o.price===null?'Kun flerstykstilbud':money(o.price)+' kr. pr. pakke · '+money(o.price/o.packageGrams*1000)+' kr./kg'}${o.multiBuy?` · ${o.multiBuy.count} pakker for ${money(o.multiBuy.price)} kr. (${money(o.multiBuy.price/(o.multiBuy.count*o.packageGrams)*1000)} kr./kg)`:''}<br>${o.type==='regular'?'Normalpris':'Tilbud'} · ${o.validFrom?dateLabel(o.validFrom):'uden startdato'} – ${o.validTo?dateLabel(o.validTo):'ingen slutdato'}${o.memberOnly?' · kun medlemmer':''} · ${o.postalCode?'Postnr. '+esc(o.postalCode):'National kilde, kontrollér lokal butik'}<br>Matches til ${esc(INGREDIENTS[o.ingredientId]?.name||o.ingredientId)}<br>${sourceLink(o.source)}</div><div class="form-actions">${o.manual?`<button class="ghost small" data-action="edit-offer" data-id="${esc(o.id)}">${icon('edit')} Ret pris</button>`:''}<button class="ghost small" data-action="delete-offer" data-id="${esc(o.id)}">${icon('trash')} Fjern</button></div></section>`;}).join('')}`;

function showModal(title,body){
 previousFocus=document.activeElement;modal=true;
 $('#dialog-root').innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title">${title}</h2><button data-action="close" aria-label="Luk">${icon('close')}</button></div>${body}</section></div>`;
 $('#dialog-root button, #dialog-root input')?.focus();document.body.style.overflow='hidden';
}
function closeModal(){modal=null;$('#dialog-root').innerHTML='';document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus();}

 const o=state.offers.find(o=>o.id===id)||{ingredientId:ingredient||Object.keys(INGREDIENTS)[0],store:store||CHAINS[0].id,price:'',packageGrams:'',validFrom:state.profile.date,validTo:state.profile.date,type:'offer',postalCode:state.profile.postalCode};
 showModal(id?'Ret din pris':'Tilføj en pris fra butikken',`<form id="offer-form" data-id="${esc(id)}"><p>Prisen bruges direkte i kurven, hvis dato, postnummer og medlemskab passer. Brug samme vare og fedtprocent som næringsreferencen.</p><div class="form-grid"><label class="field full">Ingrediens i opskrifterne<select name="ingredientId">${ingredientOptions(o.ingredientId)}</select><small id="offer-weight-note">${esc(INGREDIENTS[o.ingredientId]?.weightNote)}</small></label><label class="field">Butik<select name="store">${chainOptions(o.store)}</select></label><label class="field">Pristype<select name="type"><option value="offer" ${o.type!=='regular'?'selected':''}>Tilbud</option><option value="regular" ${o.type==='regular'?'selected':''}>Normalpris</option></select></label><label class="field full">Præcist varenavn<input name="name" value="${esc(o.name||'')}" placeholder="Fx kyllingebryst uden skind og ben" maxlength="180" required></label>${field('Spiselige gram pr. pakke','packageGrams',o.packageGrams,'number','min="1" max="100000" step="0.1" required')}${field('Pris for én pakke (kr.)','price',o.price??'','number','min="0" max="100000" step="0.01"')}<div class="field full"><small>Ved æg: samlet vægt uden skal. Ved bønner: drænet vægt. Ved olie: gram, ikke ml. Lad enkeltprisen være tom, hvis varen kun sælges som flerstykstilbud.</small></div>${field('Flerstyk: antal pakker','bundleCount',o.multiBuy?.count||'','number','min="2" max="100" step="1"')}${field('Flerstyk: samlet pris (kr.)','bundlePrice',o.multiBuy?.price??'','number','min="0" max="100000" step="0.01"')}${field('Gælder fra','validFrom',o.validFrom||state.profile.date,'date','required')}${field('Gælder til / kontroller igen','validTo',o.validTo||state.profile.date,'date','required')}${field('Postnr. (tom = landsdækkende)','postalCode',o.postalCode||'','text','inputmode="numeric" pattern="[0-9]{4}" maxlength="4"')}<label class="field">Kilde / hvor så du prisen?<input name="source" value="${esc(typeof o.source==='object'?o.source.url:o.source||'')}" placeholder="URL eller fx egen bon, dato og butik" maxlength="1000" required></label></div><label class="check-field"><input type="checkbox" name="memberOnly" ${o.memberOnly?'checked':''}>Kun medlemspris</label><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem pris og genberegn</button></div></form>`);
}
function pantryModal(id=''){const row=state.pantry.find(r=>r.id===id);showModal('Hvad har du allerede?',`<form id="pantry-form"><div class="form-grid"><label class="field full">Ingrediens<select name="id">${ingredientOptions(id)}</select></label>${field('Tilgængelig, spiselig mængde (gram)','grams',row?.grams||'','number','min="0" max="1000000" step="0.1" required')}</div><p>Ris og pasta vejes tørre, bønner drænede og kød råt uden ben. Mængden erstatter en tidligere beholdning af samme ingrediens.</p><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem mit lager</button></div></form>`);}
function recipeModal(id,servings=1){const r=currentRecipe(id)||recipes().find(r=>r.id===id);if(!r)return;const ingredients=currentIngredients();const n=nutritionForRecipe(r,ingredients);showModal(esc(r.name),`${foodArt(r)}<p>${esc(r.description)} · ${r.minutes} min. · ${servings} portioner</p>${macroBar(n)}<p class="tiny muted" style="margin-top:12px">Næring pr. person og portion · beregnet estimat. ${r.diet==='meat'&&r.category==='dinner'?'200 g råt, spiseligt kød pr. person.':''}</p><h3>Ingredienser til ${servings} ${servings===1?'portion':'portioner'}</h3>${recipeIngredients(r,ingredients).map(i=>`<div class="ingredient-row"><span>${esc(ingredients[i.id]?.name||i.id)}<small class="muted" style="display:block;font-size:9px;margin-top:5px">${esc(ingredients[i.id]?.weightNote)}</small></span><strong class="no-wrap">${grams(i.grams*servings)}</strong></div>`).join('')}<h3>Sådan gør du</h3>${r.steps.map((s,i)=>`<div class="step"><span class="step-number">${i+1}</span><span>${esc(s)}</span></div>`).join('')}<h3>Opbevaring og portioner</h3><p>${esc(r.storage)}</p><p>${esc(r.portionNote||'Fordel den færdige ret ligeligt. Rå vægt er ikke tilberedt vægt.')}</p><details><summary class="tiny">Se næringskilder og vægtgrundlag</summary><p class="tiny">${esc(NUTRITION_NOTE)}</p>${r.ingredients.map(i=>`<p class="tiny">${esc(ingredients[i.id]?.name)}: ${sourceLink(ingredients[i.id]?.source)}</p>`).join('')}</details><div class="form-actions"><button class="primary" data-action="close">Tilbage til min uge</button></div>`);}
function swapModal(index){const day=state.plan.days[index];const allowed=recipes().filter(r=>r.category==='dinner'&&r.id!==day.meals.dinner&&(r.diet!=='fish'||state.profile.allowFish)&&(r.diet!=='vegetarian'||state.profile.allowVegetarian));showModal(`Noget andet til ${esc(day.label)}?`,`<p>Du udskifter kun denne aften. Indkøbslisten og hele pakker genberegnes. Portionskravet og budgettet bevares.</p>${allowed.map(r=>{const n=nutritionForRecipe(r,INGREDIENTS);return `<button class="recipe-picker" data-action="choose-swap" data-id="${esc(r.id)}" data-index="${index}">${icon('chef')}<span>${esc(r.name)}<small>${Math.round(n.kcal)} kcal · ${Math.round(n.protein)} g protein · ${r.diet==='meat'?'200 g råt kød':r.diet==='fish'?'Fisk':'Vegetarisk'}</small></span>${icon('arrow')}</button>`;}).join('')}`);}
function customRecipeModal(id=''){
 const r=state.customRecipes.find(r=>r.id===id)||{name:'',category:'dinner',diet:'meat',minutes:30,ingredients:[],steps:[],description:''};
 showModal(id?'Ret din opskrift':'Din egen opskrift',`<form id="recipe-form" data-id="${esc(id)}"><p>Angiv gram pr. person og portion. Kødaftensmad tilpasses altid til præcis 200 g råt, spiseligt kød. Andre ingredienser ændres ikke.</p><div class="form-grid">${field('Navn','name',r.name,'text','required maxlength="120"')}${field('Tilberedningstid (min.)','minutes',r.minutes,'number','min="1" max="600" required')}<label class="field">Måltid<select name="category">${[['dinner','Aftensmad'],['breakfast','Morgenmad'],['lunch','Frokost']].map(([v,l])=>`<option value="${v}" ${r.category===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Proteinkilde<select name="diet">${[['meat','Kød'],['fish','Fisk'],['vegetarian','Vegetarisk']].map(([v,l])=>`<option value="${v}" ${r.diet===v?'selected':''}>${l}</option>`).join('')}</select></label></div><h3>Gram pr. portion</h3><p>Sæt kun gram på de ingredienser, du bruger. Kilder og rå/tør/drænet vægt følger ingrediensen.</p><div class="form-grid">${Object.entries(INGREDIENTS).map(([id,i])=>field(esc(i.name),`grams-${id}`,r.ingredients.find(x=>x.id===id)?.grams||'','number','min="0" max="5000" step="0.1"')).join('')}</div><label class="field full" style="margin-top:20px">Fremgangsmåde, ét trin pr. linje<textarea name="steps" required maxlength="10000">${esc(r.steps.join('\n'))}</textarea></label><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem min opskrift</button></div></form>`);
}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b){if(e.target.classList.contains('dialog-backdrop'))closeModal();return;}
 e.preventDefault();const {action,id,index,ingredient,store}=b.dataset;
 try{
 switch(action){
 case 'nav':view=b.dataset.view;activeDay=-1;render();window.scrollTo(0,0);break;
 case 'settings':settingsModal();break;
 case 'generate':recalculate(true);state.history.unshift(structuredClone(state.plan));state.history=state.history.slice(0,12);activeDay=-1;persist();render();toast('Din ugeplan er klar og gemt på enheden.');break;
 case 'day':activeDay=Number(index);render();break;
 case 'offer':offerModal('',ingredient,store);break;
 case 'edit-offer':offerModal(id);break;
 case 'delete-offer':state.offers=state.offers.filter(o=>o.id!==id);recalculate();render();toast('Prisen er fjernet. Kurven er genberegnet.');break;
 case 'pantry':pantryModal(ingredient);break;
 case 'delete-pantry':state.pantry=state.pantry.filter(r=>r.id!==id);recalculate();render();break;
 case 'recipe':recipeModal(id,Number(b.dataset.servings)||1);break;
 case 'swap':swapModal(Number(index));break;
 case 'choose-swap':{
  const days=structuredClone(state.plan.days);days[Number(index)].meals.dinner=id;
  let run=0,last='';for(const d of days){run=d.meals.dinner===last?run+1:1;last=d.meals.dinner;if(run>state.profile.maxRepeat){toast('Retten ville gentage sig flere dage end dit valgte maksimum. Vælg en anden ret.');return;}}
  state.plan=calculatePlan({days,profile:state.profile,recipes:recipes(),ingredients:INGREDIENTS,offers:state.offers,pantry:state.pantry});state.checked={};state.cookedWeights={};persist();closeModal();render();toast('Retten er udskiftet. Hele ugens indkøb er genberegnet.');break;
 }
 case 'custom-recipe':customRecipeModal(id);break;
 case 'close':closeModal();break;
 case 'export':exportState(state);toast('Sikkerhedskopi er klar. Gem filen et sikkert sted.');break;
 case 'import':$('#backup-file').click();break;
 case 'history':state.plan=structuredClone(state.history[Number(index)]);state.profile={...base.profile,...state.plan.profile};state.checked={};state.cookedWeights={};persist();view='week';activeDay=-1;render();toast('Gemt uge åbnet med de oprindelige priser og opskrifter.');break;
 case 'refresh-offers':{
  busy=true;render();const result=await fetchOffers({postalCode:state.profile.postalCode,date:state.profile.date});
  if(Array.isArray(result.offers))for(const o of result.offers){const i=state.offers.findIndex(x=>x.id===o.id);if(i<0)state.offers.push(o);else if(!state.offers[i].manual)state.offers[i]=o;}
  state.statuses=result.statuses||[];recalculate();busy=false;render();toast(result.offers?.length?'Se dato og kilde på hver pris.':'Ingen nye automatiske priser. Brug tilbudsaviserne og indtast manuelt.');break;
 }
 }
 }catch(error){busy=false;toast(error.message||'Handlingen kunne ikke gennemføres.');}
});
document.addEventListener('change',async e=>{
 const input=e.target;
 if(input.dataset.cooked){const total=Number(input.value),count=Number(input.dataset.servings);if(input.value!==''&&Number.isFinite(total)&&total>=0){state.cookedWeights||={};state.cookedWeights[input.dataset.cooked]=total;const output=document.getElementById('weigh-'+input.dataset.cooked);if(output)output.textContent=grams(total/count)+' i hver madkasse';persist();}else if(input.value===''){delete (state.cookedWeights||{})[input.dataset.cooked];const output=document.getElementById('weigh-'+input.dataset.cooked);if(output)output.textContent='Vej hele den færdige mængde';persist();}}
 if(input.dataset.profile){const key=input.dataset.profile;if(key==='postalCode'&&!/^\d{4}$/.test(input.value)){toast('Angiv et dansk postnummer med fire cifre.');return;}if(key==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(input.value))return;state.profile[key]=['persons','maxStores'].includes(key)&&input.value!=='free'?Number(input.value):input.value;recalculate(key==='mode'||key==='date');activeDay=-1;render();toast('Ugen er genberegnet. Dit budget er bevaret.');}
 if(input.dataset.check){state.checked[input.dataset.check]=input.checked;persist();input.closest('.list-row').classList.toggle('checked',input.checked);}
 if(input.name==='ingredientId'&&$('#offer-weight-note'))$('#offer-weight-note').textContent=INGREDIENTS[input.value]?.weightNote||'';
 if(input.id==='backup-file'&&input.files[0]){try{const backup=await importBackup(input.files[0]);showModal('Indlæs sikkerhedskopi',`<p>Dette erstatter din nuværende profil, dit lager og dine gemte planer med filens indhold. Eksportér først, hvis du vil bevare den nuværende opsætning.</p><div class="form-actions"><button class="secondary" data-action="close">Annuller</button><button class="primary" id="confirm-import">Erstat med sikkerhedskopi</button></div>`);$('#confirm-import').addEventListener('click',()=>{state={...base,...backup,profile:{...base.profile,...backup.profile}};storageBlocked=false;persist();if(!state.plan)recalculate(true);closeModal();render();toast('Sikkerhedskopien er indlæst.');},{once:true});}catch(err){toast(err.message);}input.value='';}
});
document.addEventListener('submit',e=>{
 const form=e.target;if(!['profile-form','offer-form','pantry-form','recipe-form'].includes(form.id))return;e.preventDefault();const f=new FormData(form),num=k=>Number(f.get(k));
 try{
 if(form.id==='profile-form'){
  state.profile={...state.profile,budget:num('budget'),postalCode:f.get('postalCode'),date:f.get('date'),maxRepeat:num('maxRepeat'),allowFish:f.has('allowFish'),allowVegetarian:f.has('allowVegetarian'),members:f.getAll('members'),targets:[0,1].map(i=>Object.fromEntries(['kcal','protein','carbs','fat'].map(k=>[k,Number(f.get(`target-${i}-${k}`))||null])))};recalculate(true);
 }
 if(form.id==='offer-form'){
  const hasPrice=f.get('price')!=='',hasBundle=f.get('bundleCount')!==''&&f.get('bundlePrice')!=='';
  if(!hasPrice&&!hasBundle)throw Error('Angiv enten pris pr. pakke eller et komplet flerstykstilbud.');
  if((f.get('bundleCount')!==''||f.get('bundlePrice')!=='')&&!hasBundle)throw Error('Angiv både antal pakker og samlet flerstykspris.');
  if(f.get('validFrom')>f.get('validTo'))throw Error('Slutdatoen skal være på eller efter startdatoen.');
  const o={id:form.dataset.id||`manual-${crypto.randomUUID?.()||Date.now()}`,name:f.get('name').trim(),ingredientId:f.get('ingredientId'),store:f.get('store'),packageGrams:num('packageGrams'),price:hasPrice?num('price'):null,multiBuy:hasBundle?{count:num('bundleCount'),price:num('bundlePrice')}:null,memberOnly:f.has('memberOnly'),type:f.get('type'),validFrom:f.get('validFrom'),validTo:f.get('validTo'),postalCode:f.get('postalCode'),source:f.get('source').trim(),manual:true,verifiedAt:new Date().toISOString()};
  if(!o.name||!o.source)throw Error('Varenavn og kilde skal udfyldes.');const idx=state.offers.findIndex(x=>x.id===o.id);if(idx>=0)state.offers[idx]=o;else state.offers.push(o);recalculate();
 }
 if(form.id==='pantry-form'){const id=f.get('id');state.pantry=state.pantry.filter(r=>r.id!==id);if(num('grams')>0)state.pantry.push({id,grams:num('grams')});recalculate();}
 if(form.id==='recipe-form'){
  const r={id:form.dataset.id||`own-${crypto.randomUUID?.()||Date.now()}`,name:f.get('name').trim(),category:f.get('category'),diet:f.get('diet'),minutes:num('minutes'),ingredients:Object.keys(INGREDIENTS).map(id=>({id,grams:num(`grams-${id}`)})).filter(i=>i.grams>0),steps:f.get('steps').split('\n').map(s=>s.trim()).filter(Boolean),description:'Din egen opskrift, gemt på enheden.',storage:'Køl hurtigt ned i lave madkasser. Højst 2 dage på køl ved maks. 5 °C; frys resterende portioner. Optø i køleskab og genopvarm til mindst 75 °C.'};
  if(!r.name||!r.ingredients.length||!r.steps.length)throw Error('Angiv navn, mindst én ingrediens og tilberedningstrin.');
  if(r.category==='dinner'&&r.diet==='meat'&&!r.ingredients.some(i=>INGREDIENTS[i.id]?.isMeat))throw Error('En kødaftensmad skal indeholde råt kød.');
  if(r.diet==='vegetarian'&&r.ingredients.some(i=>INGREDIENTS[i.id]?.isMeat||INGREDIENTS[i.id]?.category==='fish'))throw Error('En vegetarret kan ikke indeholde kød eller fisk.');
  if(r.diet==='fish'&&!r.ingredients.some(i=>INGREDIENTS[i.id]?.category==='fish'))throw Error('En fiskeret skal indeholde fisk.');
  r.ingredients=recipeIngredients(r,INGREDIENTS);const idx=state.customRecipes.findIndex(x=>x.id===r.id);if(idx<0)state.customRecipes.push(r);else state.customRecipes[idx]=r;recalculate();
 }
 closeModal();render();toast('Gemt på enheden. Ugen er genberegnet.');
 }catch(err){toast(err.message);}
});
document.addEventListener('keydown',e=>{
 if(!modal)return;if(e.key==='Escape')closeModal();
 if(e.key==='Tab'){const items=[...document.querySelectorAll('.dialog button,.dialog a,.dialog input,.dialog select,.dialog textarea,.dialog summary')].filter(x=>!x.disabled&&x.getClientRects().length);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
render();
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('./sw.js').then(async reg=>{await navigator.serviceWorker.ready;const ready=await caches.has('sondagsro-flat-v2');if(!ready)console.info('Offlinecache forberedes.');}).catch(()=>toast('Offlinefiler kunne ikke gemmes. Åbn appen igen med internet.'));}

document.addEventListener('click', e=>{const link=e.target.closest('a[href^="./docs/"]');if(!link)return;const key=link.getAttribute('href').split('/').pop().replace('.md','');if(!__docs[key])return;e.preventDefault();e.stopImmediatePropagation();showModal(({INSTALLATION:'Installér på iPhone',NUTRITION:'Næringskilder',SOURCES:'Tilbudskilder'})[key],'<div style="white-space:pre-wrap;font-size:12px;line-height:1.85">'+esc(__docs[key])+'</div>');},true);
return {};
})();
</script></body>
