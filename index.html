__modules["app.js"]=(()=>{
const __docs={"INSTALLATION":"# MealPreppe på iPhone\n\nUpload de fire færdige appfiler direkte i roden af dit eksisterende GitHub-repository. Brug Add file > Upload files. De hedder index.html, sw.js, manifest.webmanifest og apple-touch-icon.png.\n\nGem med Commit changes. Din eksisterende Pages-indstilling og webadresse kan beholdes. Åbn webadressen med ?v=3 efter publiceringen.\n\nDu behøver hverken Node.js, en Mac eller en Apple-udviklerkonto. En ZIP-fil, som blot uploades til GitHub, bliver ikke pakket ud af GitHub; vælg de løse filer.\n\n# Opdatér din eksisterende app til MealPreppe\n\nDu beholder dit eksisterende GitHub-repository og din nuværende webadresse.\n\n1. Pak MealPreppe-pakken ud i **Filer** på din iPhone.\n2. Åbn repositoryet i Safari. Vælg **Add file → Upload files → choose your files → Gennemse**.\n3. Upload de fire færdige filer `index.html`, `sw.js`, `manifest.webmanifest` og `apple-touch-icon.png` direkte i repositoryets rod. De erstatter filerne med samme navn. Upload ikke ZIP-filen som app.\n4. Tryk **Commit changes**. Vent på GitHubs publicering.\n5. Åbn din eksisterende webadresse med `?v=3` til sidst, fx `https://maltekorsbjerg.github.io/MealPrepper/?v=3`.\n6. Luk alle åbne faner og hjemmeskærmsvinduer med appen, og åbn igen, så den nye offlineversion kan aktiveres.\n\nPages-indstillingerne skal ikke ændres. Ingen Mac, Node.js, Apple-udviklerkonto eller betalt AI-API kræves til den færdige app.\n\n## Dine eksisterende data\n\nProfil, lager, egne opskrifter og gemte planer bliver i den samme lokale lagring. Appens navn ændres; opdateringen sletter ikke dine data. Hold samme webadresse og browser. Eksportér gerne en sikkerhedskopi, før du flytter appen eller rydder browserdata.\n\nSlet ikke appen eller Safari-webstedsdata som et opdateringstrin. Hvis iPhone stadig viser det tidligere navn på hjemmeskærmen, kan navnet på genvejen ændres, eller genvejen kan oprettes igen efter en sikkerhedskopi. Browser- og hjemmeskærmslagring kan være adskilt på iOS.\n\n## Tilbud\n\nKun REMA 1000 og Netto indgår i den nye app. Priser skal have dokumenterede vareoplysninger, pakningsstørrelse og gyldighed. En national tilbudskilde garanterer ikke lokal lagerstatus eller butiksspecifikke undtagelser. En vare uden gyldig pris vises som uafklaret.\n\nAutomatisk opdatering kræver den datakilde og eventuelle GitHub Actions-opsætning, der følger med den konkrete leverance. De fire appfiler alene er ikke en garanti for, at en ekstern tilbudskilde kan hentes. Se pakkens tilbudsvejledning og den viste hentestatus i appen.\n\n\n## 2. Føj til hjemmeskærmen\n\n1. Åbn appens HTTPS-adresse i **Safari** på iPhone.\n2. Lad siden indlæse færdig med internetforbindelse, så appfilerne kan gemmes offline.\n3. Tryk **Del** og derefter **Føj til hjemmeskærm**. På nyere iOS kan **Åbn som webapp** være en kontakt, der skal være slået til.\n4. Åbn **MealPreppe** fra hjemmeskærmen. Lav og gem din første ugeplan her.\n5. Kontrollér offlineadgangen: Luk appen, slå flytilstand til, og åbn den igen. Den gemte ugeplan, opskrifterne og indkøbslisten skal kunne åbnes. Nye tilbud og eksterne kildesider kræver internet.\n\nWebapps installeret på hjemmeskærmen kan have andet lokalt lager end en Safari-fane. Eksportér og importér en sikkerhedskopi, hvis data ikke følger med fra fanen.\n\n## Lokal afprøvning på computer\n\nKør `npm run build` og `npm start`, og åbn `http://localhost:4173` på computeren. `localhost` er en særlig sikker kontekst på computeren. `http://COMPUTERENS-IP:4173` på iPhone giver almindeligvis **ikke** adgang til service workers og opfylder derfor ikke kravet til installation med offlineadgang. En HTTPS-hostingadresse er den enkleste iPhone-løsning.\n\n## Opdatering, flytning og sikkerhedskopi\n\n- Brug appens **Eksportér sikkerhedskopi**, og gem JSON-filen i Filer eller et andet sted, du selv vælger. Brug **Importér sikkerhedskopi** for at flytte data til en ny enhed eller gendanne dem.\n- Opdater filer på **samme HTTPS-adresse** for at bevare adgang til det lokale lager. Luk alle vinduer med appen, og åbn den igen, så en ventende service worker kan aktiveres. Ved en kodeopdatering skal udvikleren også ændre service workerens cacheversionsnavn i `sw.js`.\n- Skifter du domæne, repositorynavn eller browser, følger lokale data ikke automatisk med. Eksportér først, og importér på den nye adresse.\n- Sletter du hjemmeskærmsappen eller Safari-webstedsdata, nulstiller telefonen eller løber tør for lager, kan lokale data gå tabt. En PWA kan ikke garantere permanent lagring mod iOS-oprydning. Gem jævnligt en sikkerhedskopi.\n- Du behøver normalt ikke geninstallere efter en opdatering. Slet kun appen efter at have sikret dine data. Hosting skal fortsat eksistere for geninstallation, opdateringer og den første indlæsning på en ny enhed; allerede gemte appfiler og planer kan bruges offline.\n\nDer er ingen løbende AI-udgift. Gratis hosting afhænger af hostingudbyderens gældende vilkår. iPhone-installation og offlineåbning skal kontrolleres på en fysisk iPhone; en test i projektets Linux-miljø kan ikke erstatte denne kontrol.\n","NUTRITION":"# Næringsgrundlag og opskrifter\n\nAppens indbyggede bibliotek indeholder 21 fødevarereferencer og 17 konkrete opskrifter: syv kødbaserede aftensmåltider, et fisketilvalg, et vegetarisk tilvalg, fire morgenmåltider og fire frokoster. Tre af morgenmåltiderne er overnight oats med skyr, som sættes på køl aftenen før. Hver kødbaseret frokost og aftensmad indeholder præcis 200 g råt, spiseligt kød pr. person. Opskrifterne er udarbejdet til appen med konkrete tilberedningstrin; de er ikke prøvetilberedt og må ikke markedsføres som køkkentestede.\n\n## Kilder\n\nAlle referenceværdier findes i `src/data.js` sammen med kilde, fødevare-ID, vægtgrundlag og kontroltidspunkt. Mængder angives i gram og næringsværdier pr. 100 g. Kilderne er:\n\n- [USDA FoodData Central](https://fdc.nal.usda.gov/): SR Legacy-poster med specifikke FDC-ID'er. Kylling 171077, kalkun 172850, oksekød 171790, svinemørbrad 168249, laks 175167, ris 169756, pasta 169736, kartofler 170026, broccoli 170379, gulerødder 170393, løg 170000, rød peber 170108, hvidkål 169975, knuste tomater 170501, drænede kidneybønner 174285, olivenolie 171413, tørre havregryn 173904, æble 171688 og æg 171287.\n- [Arla Pro Skyr Naturel 0,2 %, produkt 26707](https://www.arlapro.com/da/produkter/skyr-naturel-02pct-5kg-26707/): deklaration 61 kcal, 10 g protein, 4 g kulhydrat og 0,2 g fedt pr. 100 g. Verificeret ved faktisk opslag 2. november 2026.\n- [Schulstad Det Gode Solsikkerugbrød, produkt 19291, 950 g](https://www.schulstad.dk/alle-produkter/det-gode-solsikkerugbrod-950-g/): deklaration 242 kcal, 6,6 g protein, 33 g kulhydrat og 7,3 g fedt pr. 100 g. Verificeret ved faktisk opslag 2. november 2026. Brødet er klar til brug.\n\nSom primær tabelreference blev [USDA Standard Reference 28, korn og pasta](https://www.ars.usda.gov/ARSUserFiles/80400535/Data/SR/SR28/reports/sr28fg20.pdf) åbnet med faktisk opslag. Flere USDA-poster blev krydstjekket via indekserede gengivelser. USDA's nuværende FoodData Central-grænseflade er klientrenderet og kunne ikke udlæses komplet i researchværktøjet. De indbyggede tal er derfor et fast referenceudsnit med kildehenvisninger, ikke en påstand om en ny, fuld automatisk USDA-hentning. Fridas enkeltposter viderestillede ved opslag til den klientrenderede fcdb.fooddata.dk-grænseflade uden udlæselige næringstabeller. Appen hævder ikke, at Frida er hentet automatisk.\n\n## Beregning og begrænsninger\n\nHver ingrediens bidrager med `gram / 100 × referenceværdi`. Alle bidrag lægges sammen før afrunding til visning. Olie, skyrdressing og tomatsauce er konkrete ingredienser og indgår i næringen. Opskrifterne indeholder ingen skjult stegefedt, mayonnaise eller sauce. Vand til kogning bidrager ikke til kcal eller makroer.\n\nRis, pasta og havregryn vejes tørre. Kød og fisk vejes råt uden ben, skind eller afpuds. Bønner vejes efter dræning, og prispakkens gram skal tilsvarende være drænet spiselig mængde. Æg vejes uden skal. Væske i tomatkonserves medregnes. Olie vejes i gram, ikke milliliter. De færdige retter fordeles ligeligt efter tilberedning; den færdige portions vægt kan ikke udledes præcist af de rå gram, fordi vand optages eller fordamper.\n\nKulhydratvisningen er ensrettet til at udelade kostfibre, så brugerens danske daglige kulhydratmål ikke sammenlignes med en blanding af EU- og USDA-totaler. USDA's \"carbohydrate by difference\" gemmes uændret som `carbsTotal`; dokumenterede kostfibre gemmes som `fiber`. Appens `carbs` er `carbsTotal - fiber`. Dette er et estimat for tilgængeligt kulhydrat, ikke en påstand om en analytisk bestemt EU-varedeklaration. Energi, protein og fedt bevares som opgivet i kilden. Arla og Schulstad deklarerer allerede kulhydrat uden kostfibre; deres kulhydrat ændres ikke. Metoden står i `carbohydrateBasis` og i appens næringsnote.\n\nDe anvendte USDA-kostfibre pr. 100 g er: ris 1,3 g, pasta 3,2 g, kartofler 2,1 g, broccoli 2,6 g, gulerødder 2,8 g, løg 1,7 g, rød peber 2,1 g, hvidkål 2,5 g, knuste tomater 1,9 g, drænede kidneybønner 5,5 g, havregryn 10,1 g og æble 2,4 g. Kød, fisk, olie og æg har 0 g i de valgte poster. De angivne fiberdata blev krydstjekket i de tilsvarende indekserede FDC-gengivelser. Eksempelvis [ris FDC 169756](https://nutri-db.com/en/foods/169756), [havre FDC 173904](https://nutri-db.com/en/foods/173904), [bønner FDC 174285](https://www.datayoureat.com/r/_-UXXgrGKu8b/Kidney_beans_canned_drained?l10n=NONE) og [tomat FDC 170501](https://datanutri.com/foods/170501/tomatoes-crushed-canned). Fiber for Schulstad-brødet er 9,3 g efter producentens deklaration. Ingen ukendt fiberværdi erstattes stiltiende med nul: USDA-konstruktøren kræver et eksplicit dokumenteret fiberfelt.\n\nNæring er generiske referenceestimater, ikke en laboratoriemåling af den købte vare; andre udskæringer, fedtprocenter og mærker kan afvige. Skyrreferencen bruges kun som næringsgrundlag og siger intet om pris eller tilgængelighed i de valgte kæder.\n\nDer medfølger ingen universelle vægttabsmål. MealPreppe viser brugerens selvvalgte mål på 2.000 kcal dagligt for person 1. Det er et personligt mål, ikke en anbefaling til alle brugere eller automatisk et mål for person 2. De tre hovedmåltider vises med beregnede dagstotaler; eventuelle snacks, drikkevarer og andet, som ikke indgår i opskrifterne, skal tælles separat.\n\n## Praktisk opbevaring\n\nKøkkenplanen skal følge opskrifternes opbevaringstekst: hurtig nedkøling i lave beholdere, højst 5 °C i køleskab, højst to dages køleskabsportioner, straksfrysning af senere portioner, optøning i køleskab og grundig genopvarmning. Kolde skyrskåle, salater og kogte æg tilberedes igen senere på ugen og planlægges ikke som en uges færdig køleskabsmad.\n\n## Enkel morgenmad og frokost\n\nOvernight oats bruger 250 g skyr pr. portion og 50–60 g tørre havregryn, eventuelt æble og revet gulerod. Vand angives i fremgangsmåden og tilfører ingen næring. De tre opskrifter giver cirka 380–427 kcal og 32–33 g protein pr. person. De sættes straks i lukket beholder ved højst 5 °C og trækker 6–12 timer; saml højst to dage frem.\n\nFrokostmulighederne giver cirka 406–499 kcal og 36–58 g protein pr. person ud fra de dokumenterede referenceingredienser. Kødfrokoster bruger 200 g rå, spiselig kylling. Kålsalat, gulerod, skyr og lidt rugbrød går igen for at begrænse antallet af ingredienser. Retterne omtales som simple muligheder med få basisvarer; en lav pris kan først dokumenteres, når alle aktuelle indkøbspriser er kendt.\n","SOURCES":"# Tilbudskilder i MealPreppe\n\nKun REMA 1000 og Netto indgår. Der bruges ingen AI, ingen API-nøgle og ingen betalt datatjeneste. Appen henter en offentlig JSON-fil; en gratis GitHub Actions-opgave opdaterer den dagligt. Se AUTOMATISKE-TILBUD.md for engangsopsætning.\n\n## Faktisk hentning 2. november 2026\n\nDen selvstændige opdatering blev kørt med rigtige HTTP-opslag og skrev offers.json kl. 16.24 UTC / 17.24 dansk tid. Ingen demonstrationspriser indgår.\n\n| Kæde | Faktisk kontrolleret kilde | Resultat |\n|---|---|---|\n| REMA 1000 | https://api.digital.rema1000.dk/api/v3/products?page=1&per_page=500 | Otte sider, 3.943 produkter læst. 28 entydige tilbud/normalpriser kunne matches til næringskataloget. 182 andre poster kræver manuel kontrol. |\n| Netto | https://etilbudsavis.dk/soeg/guler%C3%B8dder og ti andre ingredienssøgninger | Elleve sider læst. Tre entydige tilbud: ØGO gulerødder 800 g/15 kr., ØGO kartofler 1 kg/16 kr. og ØGO jasminris 1 kg/20 kr. Tolv øvrige poster kræver manuel kontrol. |\n\nNettos officielle avisindgang er https://netto.dk/netto-avisen/. Produktdata læses fra eTilbudsavis' offentlige JSON indlejret i HTML. Det er en tredjepartskilde og et udvalg af relevante ingredienser, ikke hele Nettos sortiment eller alle lokale tilbud. Datofelter fra UTC omregnes til Europe/Copenhagen.\n\nREMA-API'ens query-parameter gav ikke en reel varesøgning. Adapteren læser derfor alle katalogsider med per_page=500 og bruger sikre, entydige varenavne og gram. Kilden viser både kampagner og normalpriser. Kampagners originale start/slut bevares. Normalpriser er daterede observationer og må kun bruges på observationsdagen; slutdatoer som 2099-12-31 bliver ikke til et løfte om fremtidige priser.\n\n## Vigtige afgrænsninger\n\n- Der er ingen dokumenteret butik-for-butik-søgning. Nationale priser garanterer ikke lokal lagerstatus eller undtagelser. Egne lokale priser kan afgrænses til postnummer.\n- Kun entydige pakningsgram matches automatisk. Stykvarer, variable vægte, ukendt drænet/spiselig vægt, uklare flerstykstilbud, mængdelofter og blandede varianter kræver manuel kontrol. Kilopriser vises ud fra den dokumenterede pakkepris.\n- Medlems- og apppriser markeres særskilt og bruges kun ved aktivt medlemsvalg.\n- Færdigretter, kartoffelsalat, chips, havregrynskugler og lignende matches ikke til rå kartofler, tør pasta eller havregryn.\n- REMAs konkrete kyllingedetaljer blev også åbnet, bl.a. https://api.digital.rema1000.dk/api/v3/products/404995 og /404891 og /404997. De giver ikke tilstrækkelig ingrediensdeklaration til at bekræfte råt kød uden lage. Sådanne produkter er derfor ikke automatisk en kødpris i planen. Bekræft selv den præcise variant og spiselige rå gram via prisformularen.\n- Næring bruger dokumenterede ingrediensreferencer, ikke en påstand om at enhver mærkevare har identisk deklaration. Se NUTRITION.md.\n\n## Fejl og offline\n\nKilderne er offentligt læsbare, men deres udokumenterede formater kan ændre sig. Hvis én fejler, bevares tidligere observationer med uændrede gyldigheds- og kontroltidspunkter. Udløbne priser bruges aldrig til indkøbsdagen. Appen viser fejl/forældelse og lader dig indtaste egne priser. En ufuldstændigt prissat plan bliver altid uafklaret, også hvis den kendte del koster mindre end budgettet.\n\nGitHub-opdateringen gemmer kun offentlige prisdata. Profil, lager, opskrifter, planer og afkrydsninger ligger fortsat kun på enheden. GitHub Actions kan forsinke eller deaktivere en planlagt kørsel, fx efter længere inaktivitet; appen viser derfor kontroltidspunkt og lader dig køre opdateringen manuelt.\n","UPDATE-MEALPREPPE":"# Opdatér din eksisterende app til MealPreppe\n\nDu beholder dit eksisterende GitHub-repository og din nuværende webadresse.\n\n1. Pak MealPreppe-pakken ud i **Filer** på din iPhone.\n2. Åbn repositoryet i Safari. Vælg **Add file → Upload files → choose your files → Gennemse**.\n3. Upload de fire færdige filer `index.html`, `sw.js`, `manifest.webmanifest` og `apple-touch-icon.png` direkte i repositoryets rod. De erstatter filerne med samme navn. Upload ikke ZIP-filen som app.\n4. Tryk **Commit changes**. Vent på GitHubs publicering.\n5. Åbn din eksisterende webadresse med `?v=3` til sidst, fx `https://maltekorsbjerg.github.io/MealPrepper/?v=3`.\n6. Luk alle åbne faner og hjemmeskærmsvinduer med appen, og åbn igen, så den nye offlineversion kan aktiveres.\n\nPages-indstillingerne skal ikke ændres. Ingen Mac, Node.js, Apple-udviklerkonto eller betalt AI-API kræves til den færdige app.\n\n## Dine eksisterende data\n\nProfil, lager, egne opskrifter og gemte planer bliver i den samme lokale lagring. Appens navn ændres; opdateringen sletter ikke dine data. Hold samme webadresse og browser. Eksportér gerne en sikkerhedskopi, før du flytter appen eller rydder browserdata.\n\nSlet ikke appen eller Safari-webstedsdata som et opdateringstrin. Hvis iPhone stadig viser det tidligere navn på hjemmeskærmen, kan navnet på genvejen ændres, eller genvejen kan oprettes igen efter en sikkerhedskopi. Browser- og hjemmeskærmslagring kan være adskilt på iOS.\n\n## Tilbud\n\nKun REMA 1000 og Netto indgår i den nye app. Priser skal have dokumenterede vareoplysninger, pakningsstørrelse og gyldighed. En national tilbudskilde garanterer ikke lokal lagerstatus eller butiksspecifikke undtagelser. En vare uden gyldig pris vises som uafklaret.\n\nAutomatisk opdatering kræver den datakilde og eventuelle GitHub Actions-opsætning, der følger med den konkrete leverance. De fire appfiler alene er ikke en garanti for, at en ekstern tilbudskilde kan hentes. Se pakkens tilbudsvejledning og den viste hentestatus i appen.\n","AUTOMATISKE-TILBUD":"# Automatisk opdatering af REMA og Netto i MealPreppe\n\nAppen læser sin seneste prisfil fra dit eget GitHub-repository. En gratis GitHub Actions-opgave henter dokumenterede REMA- og Netto-priser hver dag. Der bruges ingen AI, betalings-API, personlig token eller API-nøgle. Selve appen har fortsat intet login.\n\nREMA læses fra kædens offentlige produkt-API. Netto læses fra offentlige eTilbudsavis-sider med udvalgte ingredienssøgninger. Det er ikke en garanti for alle varer i avisen, alle lokale butikkers sortiment eller lagerstatus. Kildeformatet kan ændre sig; appen viser hentestatus og uafklarede priser i stedet for at opfinde priser.\n\n## 1. Upload de færdige filer\n\nUpload disse seks løse filer direkte i roden af dit eksisterende repository **MealPrepper**:\n\n- `index.html`\n- `sw.js`\n- `manifest.webmanifest`\n- `apple-touch-icon.png`\n- `offers.json`\n- `opdater_tilbud.py`\n\nBrug **Add file → Upload files → choose your files → Gennemse** i Safari, og gem med **Commit changes**. De fire appfiler erstatter filerne med samme navn. ZIP-filen skal pakkes ud i Filer først. Du behøver ikke en Mac, terminal eller installation af Python på din telefon.\n\n## 2. Opret den automatiske opgave én gang\n\nDen nemmeste vej er knappen til at aktivere automatisk opdatering i appens indkøbsvisning. Den åbner GitHub med workflowfilens navn og indhold udfyldt. Kontrollér filen, og gem med **Commit changes** på **main**. Knappen aktiverer ikke noget alene ved at blive trykket på. Opsætningen regnes først som udført, når appen har læst en prisfil fra en faktisk GitHub Actions-kørsel.\n\nHvis knappen ikke kan åbne den forudfyldte fil, kan du bruge denne manuelle vej:\n\nDen følgende fil skal ligge i GitHubs særlige workflow-mappe. Den kan oprettes direkte på din iPhone, så du ikke behøver uploade en mappe:\n\n1. Åbn dit repository på github.com i **Safari**.\n2. Vælg **Add file → Create new file**. Hvis menuerne er skjult, vælg **Anmod om computerwebsted** i Safari.\n3. I navnefeltet skriver du hele stien: **`.github/workflows/tilbud.yml`**. GitHub opretter mapperne ud fra skråstregerne.\n4. Indsæt indholdet af opsætningen i appen i tekstfeltet. Filnavnet og indrykningen skal bevares.\n5. Gem med **Commit changes** på grenen **main**.\n6. Åbn fanen **Actions**. Hvis GitHub beder dig aktivere workflows i repositoryet, vælg at aktivere dem.\n7. Vælg **Opdater REMA og Netto → Run workflow → Run workflow** for at hente første gang. Opgaven starter også, når updateren eller workflowfilen ændres.\n\nHvis opgaven mangler lov til at gemme `offers.json`, vælg **Settings → Actions → General → Workflow permissions → Read and write permissions → Save**, og kør workflowet igen. Organisationers regler eller beskyttede grene kan blokere automatiske commits; opgaven viser da en fejl i Actions.\n\n## 3. Brug appen\n\nBehold dine eksisterende **Pages**-indstillinger. Åbn den samme webadresse med **`?v=3`** til sidst efter publiceringen. Appen læser den offentlige prisfil fra `raw.githubusercontent.com` på grenen **main**, så et priscommit fra GitHub-botten ikke kræver en ny Pages-udgivelse. Dine profiler, opskrifter og planer bliver på telefonen.\n\nOpgaven er planlagt til kl. **04.17 UTC** hver dag, normalt kl. 05.17 dansk vintertid og 06.17 dansk sommertid. GitHub kan forsinke planlagte kørsler. I offentlige repositories kan GitHub automatisk deaktivere en planlagt opgave efter 60 dages inaktivitet; den kan aktiveres igen under Actions. En gratis konto er nok til GitHub-hostede standardrunners i et offentligt repository, inden for GitHubs gældende vilkår.\n\n## Når en kilde fejler\n\nHver kæde har sin egen status. Hvis én kilde fejler eller kun kan læses delvist, bevares tidligere, stadig gyldige observationer med deres **oprindelige** gyldighed og kontroltidspunkt. Udløbne priser fjernes. En normalpris, der kun er observeret én dag, bliver ikke gjort gyldig i fremtiden.\n\nEn mislykket kørsel må ikke ligne en vellykket frisk hentning. `generatedAt` fortæller, hvornår prisfilen blev samlet; kædens `lastSuccessAt` fortæller, hvornår netop den kæde sidst blev hentet fuldt ud. Derfor kan filen være ny, mens en kædes priser er ældre eller mangler.\n\nPrisfilens `automated` er kun sand, når updateren faktisk kører med GitHub Actions-miljøets markering. Den oprindeligt medfølgende prisfil er ikke bevis for, at din egen automatiske opgave er aktiveret.\n\nDer gættes ikke pakningsstørrelser, priser eller næringsmatch. Utydelige pakninger og varianter kan vises som rå fund, men indgår først i planen efter et gyldigt match. Medlemspriser kræver dit aktive medlemsvalg. Et valgt postnummer er ikke en automatisk bekræftelse af lokal tilgængelighed.\n\n## Workflowfilens fulde indhold\n\nKopiér indholdet fra opsætningen i appen nøjagtigt. Den fulde workflowkode gengives også herunder:\n\n```yaml\nname: Opdater REMA og Netto\n\non:\n  schedule:\n    - cron: '17 4 * * *'\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths:\n      - opdater_tilbud.py\n      - .github/workflows/tilbud.yml\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: mealpreppe-offers\n  cancel-in-progress: false\n\njobs:\n  update:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Hent projekt\n        uses: actions/checkout@v4\n        with:\n          ref: main\n      - name: Installer Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Opdater dokumenterede priser\n        run: python opdater_tilbud.py --output offers.json\n      - name: Gem kun prisfilen\n        shell: bash\n        run: |\n          if [ -z \"$(git status --porcelain -- offers.json)\" ]; then\n            exit 0\n          fi\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          git add -- offers.json\n          git commit -m \"Opdater REMA- og Netto-priser\"\n          git push origin HEAD:main\n```\n\nDokumentation: [GitHub Actions i offentlige repositories](https://docs.github.com/en/billing/concepts/product-billing/github-actions), [planlagte workflows](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule), [indstilling af workflowrettigheder](https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows).\n"};

function recalculate(regenerate=false){

 // Preserve checked rows only if their quantity and price are unchanged.

ris</button></section>`;}).join('')}</div>${p.unresolved.length?`<section class="card"><div class="card-header"><h3>Mangler pris og butik</h3><span class="badge warning">${p.unresolved.length} varer</span></div><p class="helper">Disse varer er nødvendige, men ikke med i beløbet ovenfor. Deres pris er aldrig sat til 0 kr.</p>${p.unresolved.map(r=>`<div class="unresolved-row"><span><b>${esc(r.name)}</b><small>${grams(r.neededGrams)} skal købes</small></span><button class="secondary small" data-action="offer" data-ingredient="${esc(r.id)}">Tilføj pris</button></div>`).join('')}</section>`:''}<details class="card shopping-details"><summary>Tilbud og prisgrundlag <span>${valid.length} gyldige priser</span></summary>${state.statuses.length?'':'<p class="helper">Automatisk hentning kræver, at tilbudsopdateringen er slået til i GitHub. Appen henter derefter filen automatisk ved åbning.</p>'}${valid.map(o=>`<div class="offer-row"><b>${esc(o.name)}</b><small>${esc(storeName(o.store))} · ${grams(o.packageGrams)} · ${o.price===null?'Flerstykstilbud':money(o.price)+' kr. · '+money(o.price/o.packageGrams*1000)+' kr./kg'}${o.multiBuy?` · ${o.multiBuy.count} for ${money(o.multiBuy.price)} kr.`:''}${o.memberOnly?' · kun medlemmer':''}<br>${dateLabel(o.validFrom||state.profile.date)} – ${dateLabel(o.validTo||state.profile.date)} · ${sourceLink(o.source)}</small>${o.manual?`<button class="text-link" data-action="edit-offer" data-id="${esc(o.id)}">Ret pris</button>`:''}</div>`).join('')||'<p class="helper">Ingen gyldige priser for den valgte indkøbsdag.</p>'}${renderRawOffers()}</details><details class="card shopping-details"><summary>Lager og pakkerester</summary><p class="helper">Lager trækkes fra før pakkeoprunding. Pakkerester føjes først til lageret, når du selv har købt varen og retter beholdningen.</p>${p.ingredientsRequired.filter(r=>r.pantryGrams>0).map(r=>`<div class="ingredient-row"><span>${esc(r.name)} fra lager</span><b>${grams(r.pantryGrams)}</b></div>`).join('')}${p.left async function refreshOffers(showMessage=false){
 if(busy)return;busy=true;if(view==='shopping'&&!modal)render();
 try{
  const result=await fetchOffers({postalCode:state.profile.postalCode,date:state.profile.date});
  const before=JSON.stringify(state.offers),updatedStores=new Set((result.statuses||[]).filter(s=>s.status==='ok').map(s=>s.id));
  const cutoff=new Date(Date.now()-14*86400000).toISOString().slice(0,10),today=iso();
  state.offers=state.offers.filter(o=>o.manual||o.origin==='verified-snapshot'||!updatedStores.has(o.store)||(o.validTo<today&&o.validTo>=cutoff));
  for(const o of result.offers||[])if(!state.offers.some(x=>x.id===o.id))state.offers.push(o);
  const changed=before!==JSON.stringify(state.offers);
  state.statuses=result.statuses||state.statuses;state.rawOffers=[...(state.rawOffers||[]).filter(o=>!updatedStores.has(o.store)),...(result.rawOffers||[]).filter(o=>updatedStores.has(o.store)||!(state.rawOffers||[]).some(x=>x.id===o.id))];
  state.feedInfo={status:result.status||'error',updatedAt:result.updatedAt||state.feedInfo?.updatedAt||null,automated:result.automated===true||state.feedInfo?.automated===true,message:result.message||''};
  if(changed&&state.profile.date>=iso())recalculate();else persist();
  if(showMessage)toast(result.message||`${result.offers?.length||0} priser hentet.`);
 }catch(e){state.feedInfo={...state.feedInfo,status:'error',message:'Tilbud kunne ikke hentes. Gemte priser og din plan er bevaret.'};persist();if(showMessage)toast(state.feedInfo.message);}
 finally{busy=false;if(!modal)render();}
}

const field=(label,name,value,type='text',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const ingredientOptions = selected => Object.entries(INGREDIENTS).map(([id,i])=>`<option value="${id}" ${selected===id?'selected':''}>${esc(i.name)}</option>`).join('');
const chainOptions = selected => CHAINS.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('');

ton></div></form><details class="settings-details"><summary>Mit køkkenlager <small>${state.pantry.length} varer</small></summary>${state.pantry.map(r=>`<div class="ingredient-row"><span>${esc(INGREDIENTS[r.id]?.name||r.id)}</span><b>${grams(r.grams)}</b><button class="icon-button" data-action="pantry" data-ingredient="${esc(r.id)}" aria-label="Ret lager">${icon('edit')}</button><button class="icon-button" data-action="delete-pantry" data-id="${esc(r.id)}" aria-label="Fjern lager">${icon('trash')}</button></div>`).join('')||'<p class="helper">Tilføj det, du allerede har hjemme. Det trækkes fra indkøbet.</p>'}<button class="text-link" data-action="pantry">${icon('plus')}Tilføj til lager</button></details><details class="settings-details"><summary>Mine egne opskrifter <small>${state.customRecipes.length} gemt</small></summary>${state.customRecipes.map(r=>`<div class="ingredient-row"><span>${esc(r.name)}</span><button class="icon-button" data-action="custom-recipe" data-id="${esc(r.id)}" aria-label="Ret opskrift">${icon('edit')}</button></div>`).join('')}<button class="text-link" data-action="custom-recipe">${icon('plus')}Opret opskrift</button></details><details class="settings-details"><summary>Gemte uger <small>${state.history.length} gemt</small></summary>${state.history.map((h,i)=>`<div class="ingredient-row"><span>Indkøb ${dateLabel(h.profile.date)} · ${h.profile.persons} ${h.profile.persons===1?'person':'personer'}</span><button class="secondary small" data-action="history" data-index="${i}">Åbn</button></div>`).join('')||'<p class="helper">Når du trykker Lav min ugeplan, gemmes den her. De seneste 12 beholdes.</p>'}</details><details class="settings-details"><summary>Sikkerhedskopi og hjælp</summary><p class="helper">Gem en kopi før skift af telefon, geninstallation eller sletning af browserdata. Opdatering på samme webadresse bevarer dine lokale oplysninger.</p><div class="inline-actions"><button class="secondary small" data-action="export">${icon('download')}Eksportér</button><button class="secondary small" data-action="import">${icon('upload')}Importér</button></div><p><button class="text-link" data-action="setup-auto">Aktivér daglig tilbudsopdatering</button></p><p class="helper"><a href="./docs/INSTALLATION.md" target="_blank">Installation og offlinebrug ↗</a><br><a href="./docs/SOURCES.md" target="_blank">Tilbudskilder ↗</a><br><a href="./docs/AUTOMATISKE-TILBUD.md" target="_blank">Opsætning af automatisk opdatering ↗</a></p></details>`);
}

ource==='object'?o.source.url:o.source||'')}" placeholder="URL eller fx egen bon, dato og butik" maxlength="1000" required></label></div><label class="check-field"><input type="checkbox" name="memberOnly" ${o.memberOnly?'checked':''}>Kun medlemspris</label><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem pris og genberegn</button></div></form>`);
}
function pantryModal(id=''){const row=state.pantry.find(r=>r.id===id);showModal('Hvad har du allerede?',`<form id="pantry-form"><div class="form-grid"><label class="field full">Ingrediens<select name="id">${ingredientOptions(id)}</select></label>${field('Tilgængelig, spiselig mængde (gram)','grams',row?.grams||'','number','min="0" max="1000000" step="0.1" required')}</div><p>Ris og pasta vejes tørre, bønner drænede og kød råt uden ben. Mængden erstatter en tidligere beholdning af samme ingrediens.</p><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem mit lager</button></div></form>`);}
function recipeModal(id,servings=1){const r=currentRecipe(id)||recipes().find(r=>r.id===id);if(!r)return;const ingredients=currentIngredients();const n=nutritionForRecipe(r,ingredients);showModal(esc(r.name),`${foodArt(r)}<p>${esc(r.description)} · ${r.minutes} min. · ${servings} portioner</p>${macroBar(n)}<p class="tiny muted" style="margin-top:12px">Næring pr. person og portion · beregnet estimat. ${r.diet==='meat'&&r.category==='dinner'?'200 g råt, spiseligt kød pr. person.':''}</p><h3>Ingredienser til ${servings} ${servings===1?'portion':'portioner'}</h3>${recipeIngredients(r,ingredients).map(i=>`<div class="ingredient-row"><span>${esc(ingredients[i.id]?.name||i.id)}<small class="muted" style="display:block;font-size:9px;margin-top:5px">${esc(ingredients[i.id]?.weightNote)}</small></span><strong class="no-wrap">${grams(i.grams*servings)}</strong></div>`).join('')}<h3>Sådan gør du</h3>${r.steps.map((s,i)=>`<div class="step"><span class="step-number">${i+1}</span><span>${esc(s)}</span></div>`).join('')}<h3>Opbevaring og portioner</h3><p>${esc(r.storage)}</p><p>${esc(r.portionNote||'Fordel den færdige ret ligeligt. Rå vægt er ikke tilberedt vægt.')}</p><details><summary class="tiny">Se næringskilder og vægtgrundlag</summary><p class="tiny">${esc(NUTRITION_NOTE)}</p>${r.ingredients.map(i=>`<p class="tiny">${esc(ingredients[i.id]?.name)}: ${sourceLink(ingredients[i.id]?.source)}</p>`).join('')}</details><div class="form-actions"><button class="primary" data-action="close">Tilbage til min uge</button></div>`);}
function swapModal(index,category=view){
 if(!categories[category])category='dinner';
 const day=state.plan.days[index];
 const allowed=recipes().filter(r=>r.category===category&&r.id!==day.meals[category]&&(r.diet!=='fish'||state.profile.allowFish)&&(category!=='dinner'||r.diet!=='vegetarian'||state.profile.allowVegetarian));
 showModal(`Skift ${categories[category].toLowerCase()}`,`<p>${esc(day.label)} · ${state.profile.persons} ${state.profile.persons===1?'person':'personer'}. Hele ugens indkøb bliver genberegnet. Du ændrer kun dette måltid.</p>${allowed.map(r=>{const n=nutritionForRecipe(r,INGREDIENTS);return `<button class="recipe-picker" data-action="choose-swap" data-id="${esc(r.id)}" data-index="${index}" data-category="${category}">${icon(r.category==='breakfast'?'sun':'chef')}<span>${esc(r.name)}<small>${Math.round(n.kcal)} kcal · ${Math.round(n.protein)} g protein${r.diet==='meat'?' · 200 g råt kød':''}</small></span>${icon('arrow')}</button>`;}).join('')}`);
}
function customRecipeModal(id=''){
 const r=state.customRecipes.find(r=>r.id===id)||{name:'',category:'dinner',diet:'meat',minutes:30,ingredients:[],steps:[],description:''};
 showModal(id?'Ret din opskrift':'Din egen opskrift',`<form id="recipe-form" data-id="${esc(id)}"><p>Angiv gram pr. person og portion. Kødretter til frokost og aften tilpasses altid til præcis 200 g råt, spiseligt kød. Andre ingredienser ændres ikke.</p><div class="form-grid">${field('Navn','name',r.name,'text','required maxlength="120"')}${field('Tilberedningstid (min.)','minutes',r.minutes,'number','min="1" max="600" required')}<label class="field">Måltid<select name="category">${[['dinner','Aftensmad'],['breakfast','Morgenmad'],['lunch','Frokost']].map(([v,l])=>`<option value="${v}" ${r.category===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Proteinkilde<select name="diet">${[['meat','Kød'],['fish','Fisk'],['vegetarian','Vegetarisk']].map(([v,l])=>`<option value="${v}" ${r.diet===v?'selected':''}>${l}</option>`).join('')}</select></label></div><h3>Gram pr. portion</h3><p>Sæt kun gram på de ingredienser, du bruger. Kilder og rå/tør/drænet vægt følger ingrediensen.</p><div class="form-grid">${Object.entries(INGREDIENTS).map(([id,i])=>field(esc(i.name),`grams-${id}`,r.ingredients.find(x=>x.id===id)?.grams||'','number','min="0" max="5000" step="0.1"')).join('')}</div><label class="field full" style="margin-top:20px">Fremgangsmåde, ét trin pr. linje<textarea name="steps" required maxlength="10000">${esc(r.steps.join('\n'))}</textarea></label><div class="form-actions"><button type="button" class="secondary" data-action="close">Annuller</button><button type="submit" class="primary">Gem min opskrift</button></div></form>`);
}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b){if(e.target.classList.contains('dialog-backdrop'))closeModal();return;}
 e.preventDefault();const {action,id,index,ingredient,store}=b.dataset;
 try{
 switch(action){
 case 'nav':view=b.dataset.view;render();window.scrollTo(0,0);break;
 case 'settings':settingsModal();break;
 case 'setup-auto':setupAutomation();break;
 case 'copy-workflow':await navigator.clipboard.writeText(AUTOMATION_WORKFLOW);toast('Opsætningen er kopieret. Indsæt den i .github/workflows/tilbud.yml på GitHub.');break;
 case 'generate':if(state.profile.date<iso())state.profile.date=iso();recalculate(true);state.history.unshift(copy(state.plan));state.history=state.history.slice(0,12);activeDay=0;persist();render();toast('Din ugeplan er klar og gemt på enheden.');break;
 case 'day':activeDay=Math.max(0,Number(index));render();break;
 case 'offer':offerModal('',ingredient,store);break;
 case 'edit-offer':offerModal(id);break;
 case 'delete-offer':state.offers=state.offers.filter(o=>o.id!==id);recalculate();render();toast('Prisen er fjernet. Kurven er genberegnet.');break;
 case 'pantry':pantryModal(ingredient);break;
 case 'delete-pantry':state.pantry=state.pantry.filter(r=>r.id!==id);recalculate();closeModal();render();break;
 case 'recipe':recipeModal(id,Number(b.dataset.servings)||1);break;
 case 'swap':swapModal(Number(index),b.dataset.category||view);break;
 case 'choose-swap':{
  const days=copy(state.plan.days),category=b.dataset.category||'dinner';days[Number(index)].meals[category]=id;
  let run=0,last='';for(const d of days){run=d.meals[category]===last?run+1:1;last=d.meals[category];if(run>state.profile.maxRepeat){toast('Retten ville gentage sig flere dage end dit valgte maksimum. Vælg en anden ret.');return;}}
  state.plan=calculatePlan({days,profile:state.profile,recipes:recipes(),ingredients:INGREDIENTS,offers:usablePrices(),pantry:state.pantry});state.checked={};state.cookedWeights={};persist();closeModal();render();toast('Retten er udskiftet. Hele ugens indkøb er genberegnet.');break;
 }
 case 'custom-recipe':customRecipeModal(id);break;
 case 'close':closeModal();break;
 case 'export':exportState(state);toast('Sikkerhedskopi er klar. Gem filen et sikkert sted.');break;
 case 'import':$('#backup-file').click();break;
 case 'history':openHistory(Number(index));break;
 case 'refresh-offers':await refreshOffers(true);break;
 case 'map-offer':{const raw=(state.rawOffers||[]).filter(o=>['rema','netto'].includes(o.store))[Number(index)];if(!raw)break;offerModal('','',raw.store);const form=$('#offer-form');form.elements.ingredientId.insertAdjacentHTML('afterbegin','<option value="" disabled selected>Vælg den rette ingrediens</option>');form.elements.ingredientId.required=true;$('#offer-weight-note').textContent='Vælg kun en ingrediens med samme type, rå/tør vægt og fedtprocent som varen. Ukendte gram skal kontrolleres på pakningen.';for(const k of ['name','packageGrams','price','validFrom','validTo'])if(raw[k]!=null&&form.elements[k])form.elements[k].value=raw[k];form.elements.source.value=typeof raw.source==='object'?raw.source.url:raw.source||'';form.elements.memberOnly.checked=!!raw.memberOnly;if(raw.multiBuy){form.elements.bundleCount.value=raw.multiBuy.count;form.elements.bundlePrice.value=raw.multiBuy.price;}break;}
 }
 }catch(error){busy=false;toast(error.message||'Handlingen kunne ikke gennemføres.');}
});
document.addEventListener('change',async e=>{
 const input=e.target;
 if(input.dataset.cooked){const total=Number(input.value),count=Number(input.dataset.servings);if(input.value!==''&&Number.isFinite(total)&&total>=0){state.cookedWeights||={};state.cookedWeights[input.dataset.cooked]=total;const output=document.getElementById('weigh-'+input.dataset.cooked);if(output)output.textContent=grams(total/count)+' i hver madkasse';persist();}else if(input.value===''){delete (state.cookedWeights||{})[input.dataset.cooked];const output=document.getElementById('weigh-'+input.dataset.cooked);if(output)output.textContent='Vej hele den færdige mængde';persist();}}
 if(input.dataset.profile){const key=input.dataset.profile;if(key==='postalCode'&&!/^\d{4}$/.test(input.value)){toast('Angiv et dansk postnummer med fire cifre.');return;}if(key==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(input.value))return;state.profile[key]=['persons','maxStores'].includes(key)&&input.value!=='free'?Number(input.value):input.value;recalculate(key==='mode'||key==='date');activeDay=0;render();toast('Ugen er genberegnet. Dit budget er bevaret.');}
 if(input.dataset.check){state.checked[input.dataset.check]=input.checked;persist();input.closest('.shopping-row').classList.toggle('checked',input.checked);}
 if(input.name==='ingredientId'&&$('#offer-weight-note'))$('#offer-weight-note').textContent=INGREDIENTS[input.value]?.weightNote||'';
 if(input.id==='backup-file'&&input.files[0]){try{const backup=await importBackup(input.files[0]);showModal('Indlæs sikkerhedskopi',`<p>Dette erstatter din nuværende profil, dit lager og dine gemte planer med filens indhold. Eksportér først, hvis du vil bevare den nuværende opsætning.</p><div class="form-actions"><button class="secondary" data-action="close">Annuller</button><button class="primary" id="confirm-import">Erstat med sikkerhedskopi</button></div>`);$('#confirm-import').addEventListener('click',()=>{state={...copy(base),...backup,profile:{...base.profile,...backup.profile,mode:'all',maxStores:2}};state.mealpreppeVersion=3;storageBlocked=false;recalculate(true);closeModal();render();toast('Sikkerhedskopien er indlæst og den nye heldagsplan er beregnet.');},{once:true});}catch(err){toast(err.message);}input.value='';}
});
document.addEventListener('submit',e=>{
 const form=e.target;if(!['profile-form','offer-form','pantry-form','recipe-form'].includes(form.id))return;e.preventDefault();const f=new FormData(form),num=k=>Number(f.get(k));
 try{
 if(form.id==='profile-form'){
  state.profile={...state.profile,budget:num('budget'),postalCode:f.get('postalCode'),date:f.get('date'),maxRepeat:num('maxRepeat'),allowFish:f.has('allowFish'),allowVegetarian:f.has('allowVegetarian'),members:f.getAll('members'),targets:[0,1].map(i=>Object.fromEntries(['kcal','protein','carbs','fat'].map(k=>[k,Number(f.get(`target-${i}-${k}`))||null])))};recalculate(true);

  const hasPrice=f.get('price')!=='',hasBundle=f.get('bundleCount')!==''&&f.get('bundlePrice')!=='';
  if(!hasPrice&&!hasBundle)throw Error('Angiv enten pris pr. pakke eller et komplet flerstykstilbud.');
  if((f.get('bundleCount')!==''||f.get('bundlePrice')!=='')&&!hasBundle)throw Error('Angiv både antal pakker og samlet flerstykspris.');
  if(f.get('validFrom')>f.get('validTo'))throw Error('Slutdatoen skal være på eller efter startdatoen.');
  const o={id:form.dataset.id||`manual-${crypto.randomUUID?.()||Date.now()}`,name:f.get('name').trim(),ingredientId:f.get('ingredientId'),store:f.get('store'),packageGrams:num('packageGrams'),price:hasPrice?num('price'):null,multiBuy:hasBundle?{count:num('bundleCount'),price:num('bundlePrice')}:null,memberOnly:f.has('memberOnly'),type:f.get('type'),validFrom:f.get('validFrom'),validTo:f.get('validTo'),postalCode:f.get('postalCode'),source:f.get('source').trim(),manual:true,verifiedAt:new Date().toISOString()};
  if(!o.name||!o.source)throw Error('Varenavn og kilde skal udfyldes.');const idx=state.offers.findIndex(x=>x.id===o.id);if(idx>=0)state.offers[idx]=o;else state.offers.push(o);recalculate();
 }
 if(form.id==='pantry-form'){const id=f.get('id');state.pantry=state.pantry.filter(r=>r.id!==id);if(num('grams')>0)state.pantry.push({id,grams:num('grams')});recalculate();}
 if(form.id==='recipe-form'){
  const r={id:form.dataset.id||`own-${crypto.randomUUID?.()||Date.now()}`,name:f.get('name').trim(),category:f.get('category'),diet:f.get('diet'),minutes:num('minutes'),ingredients:Object.keys(INGREDIENTS).map(id=>({id,grams:num(`grams-${id}`)})).filter(i=>i.grams>0),steps:f.get('steps').split('\n').map(s=>s.trim()).filter(Boolean),description:'Din egen opskrift, gemt på enheden.',storage:'Køl hurtigt ned i lave madkasser. Højst 2 dage på køl ved maks. 5 °C; frys resterende portioner. Optø i køleskab og genopvarm til mindst 75 °C.'};
  if(!r.name||!r.ingredients.length||!r.steps.length)throw Error('Angiv navn, mindst én ingrediens og tilberedningstrin.');
  if(['lunch','dinner'].includes(r.category)&&r.diet==='meat'&&!r.ingredients.some(i=>INGREDIENTS[i.id]?.isMeat))throw Error('En kødaftensmad skal indeholde råt kød.');
  if(r.diet==='vegetarian'&&r.ingredients.some(i=>INGREDIENTS[i.id]?.isMeat||INGREDIENTS[i.id]?.category==='fish'))throw Error('En vegetarret kan ikke indeholde kød eller fisk.');
  if(r.diet==='fish'&&!r.ingredients.some(i=>INGREDIENTS[i.id]?.category==='fish'))throw Error('En fiskeret skal indeholde fisk.');
  r.ingredients=recipeIngredients(r,INGREDIENTS);const idx=state.customRecipes.findIndex(x=>x.id===r.id);if(idx<0)state.customRecipes.push(r);else state.customRecipes[idx]=r;recalculate();
 }
 closeModal();render();toast('Gemt på enheden. Ugen er genberegnet.');
 }catch(err){toast(err.message);}
});
document.addEventListener('keydown',e=>{
 if(!modal)return;if(e.key==='Escape')closeModal();
 if(e.key==='Tab'){const items=[...document.querySelectorAll('.dialog button,.dialog a,.dialog input,.dialog select,.dialog textarea,.dialog summary')].filter(x=>!x.disabled&&x.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
window.addEventListener('online',()=>{render();refreshOffers();});window.addEventListener('offline',()=>render());
render();
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>toast('Offlinefiler kunne ikke gemmes. Prøv igen med internet.'));
if(navigator.onLine)refreshOffers();

function setupAutomation(){
 let owner='maltekorsbjerg',repo='MealPrepper';
 if(location.hostname.endsWith('.github.io')){owner=location.hostname.slice(0,-'.github.io'.length);repo=location.pathname.split('/').filter(Boolean)[0]||owner+'.github.io';}
 const url=new URL('https://github.com/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/new/main');
 url.searchParams.set('filename','.github/workflows/tilbud.yml');url.searchParams.set('value',AUTOMATION_WORKFLOW);
 showModal('Daglige tilbud, helt automatisk',`<p>Kontrollér, at <b>opdater_tilbud.py</b> og <b>offers.json</b> fra ZIP-filen også er uploadet sammen med de fire appfiler.</p><p>Tryk nedenfor. GitHub åbner med opsætningen udfyldt. Gem den med <b>Commit changes</b>. Opdateringen starter første gang med det samme og derefter hver morgen.</p><a class="primary" href="${esc(url.href)}" target="_blank" rel="noopener">Opret tilbudsopdatering på GitHub ${icon('arrow')}</a><p class="helper">Gratis i dit offentlige repository. Ingen API-nøgle og ingen AI-tjeneste. Dit eksisterende login til GitHub bruges kun til opsætningen.</p><details class="subtle-details"><summary>Hvis GitHub ikke udfylder filen</summary><p>Vælg Add file → Create new file. Filnavnet skal være <b>.github/workflows/tilbud.yml</b>. Kopiér koden nedenfor, indsæt den og gem med Commit changes.</p><button class="secondary small" data-action="copy-workflow">Kopiér opsætningen</button><pre class="workflow-code">${esc(AUTOMATION_WORKFLOW)}</pre></details><p class="helper">Efter første kørsel: gå til Indkøb, og tryk på opdateringspilen. Hentestatus viser, om begge kilder lykkedes. GitHub kan forsinke en planlagt kørsel; gamle tilbud får aldrig nye datoer.</p>`);
}

function openHistory(index){
 const archived=copy(state.history[index]);if(!archived)return;
 closeModal();
 state.profile={...state.profile,...archived.profile,targets:state.profile.targets,mode:'all',maxStores:2};
 const ingredients={...INGREDIENTS,...archived.ingredientSnapshot};
 const allRecipes=[...archived.recipeSnapshot,...recipes().filter(r=>!archived.recipeSnapshot.some(x=>x.id===r.id))];
 const fresh=planWeek({profile:state.profile,recipes:allRecipes,ingredients,offers:usablePrices(),pantry:state.pantry});
 const days=archived.days.map((day,i)=>({...day,meals:{...fresh.days[i]?.meals,...day.meals}}));
 state.plan=calculatePlan({days,profile:state.profile,recipes:allRecipes,ingredients,offers:usablePrices(),pantry:state.pantry});
 state.checked={};state.cookedWeights={};persist();view='dinner';activeDay=0;render();
 toast('Ugens retter er åbnet. Indkøb er genberegnet for REMA og Netto; den oprindelige uge er bevaret i arkivet.');
}

document.addEventListener('click', e=>{const link=e.target.closest('a[href^="./docs/"]');if(!link)return;const key=link.getAttribute('href').split('/').pop().replace('.md','');if(!__docs[key])return;e.preventDefault();e.stopImmediatePropagation();showModal(({INSTALLATION:'Installér på iPhone',NUTRITION:'Næringskilder',SOURCES:'Tilbudskilder','UPDATE-MEALPREPPE':'Opdatér til MealPreppe','AUTOMATISKE-TILBUD':'Automatiske tilbud'})[key]||'MealPreppe','<div style="white-space:pre-wrap;font-size:12px;line-height:1.85">'+esc(__docs[key])+'</div>');},true);
return {};
})();
